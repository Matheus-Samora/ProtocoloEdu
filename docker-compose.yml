version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: protocoloedu_core
    restart: unless-stopped
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_KEY=${ADMIN_KEY:-imes-admin-2026}
      - SUPER_ADMIN_KEY=${SUPER_ADMIN_KEY:-master-protocolo-2026}
      - ENVIRONMENT=production
    volumes:
      # Volumes persistentes para custódia de dados institucionais
      - ./storage:/app/storage
      - ./data_dossiers:/app/data_dossiers
      - ./institutions_catalog.json:/app/institutions_catalog.json
      - ./courses_catalog.json:/app/courses_catalog.json
      - ./criteria.json:/app/criteria.json
    networks:
      - protocoloedu_net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/system/health-telemetry')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: protocoloedu_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./static:/app/static:ro
    depends_on:
      - app
    networks:
      - protocoloedu_net

networks:
  protocoloedu_net:
    driver: bridge
