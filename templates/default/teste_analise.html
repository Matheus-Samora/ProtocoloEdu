<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Teste de Análise em Lote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Estilo para a barra de rolagem do resultado */
        #results::-webkit-scrollbar { width: 6px; }
        #results::-webkit-scrollbar-track { background: #1a202c; }
        #results::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 3px; }
        #results::-webkit-scrollbar-thumb:hover { background: #718096; }
    </style>
</head>
<body class="bg-gray-50 h-full flex items-center justify-center p-4">
    <div class="w-full max-w-4xl mx-auto p-8 bg-white rounded-2xl shadow-xl border border-gray-200">
        <div class="flex flex-col items-center mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600 mb-2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="m10 14-2 2 2 2"></path><path d="m14 18 2-2-2-2"></path></svg>
            <h1 class="text-3xl font-bold text-gray-800">Teste de Análise de Documentos em Lote</h1>
            <p class="text-gray-500 mt-1">Anexe múltiplos tipos de documentos e envie para uma única análise.</p>
        </div>
        
        <form id="analysisForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="studentName" class="block text-sm font-medium text-gray-700 mb-1">Nome Completo do Aluno</label>
                    <input type="text" id="studentName" name="studentName" value="ALUNO DE TESTE" class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required>
                </div>
                <div>
                    <label for="courseType" class="block text-sm font-medium text-gray-700 mb-1">Tipo de Curso</label>
                    <select id="courseType" name="courseType" class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                        <option>1ª Graduação</option>
                        <option>2ª Graduação</option>
                        <option>Pós-Graduação</option>
                        <option>Cursos Rápidos</option>
                    </select>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Documentos para Análise</label>
                <div id="document-upload-area" class="space-y-4 max-h-[40vh] overflow-y-auto p-4 bg-gray-50 border rounded-lg">
                    <!-- Os campos de upload serão gerados aqui pelo JavaScript -->
                </div>
            </div>

            <div>
                <button type="submit" id="submitButton" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-base font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform hover:scale-105">
                    Enviar para Análise
                </button>
            </div>
        </form>

        <div id="loading" class="hidden text-center mt-6">
            <div class="flex justify-center items-center space-x-2">
                <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-gray-600">A analisar... Por favor, aguarde.</p>
            </div>
        </div>

        <div class="mt-8">
            <h2 class="text-lg font-semibold text-gray-800">Resultado da Análise (JSON):</h2>
            <pre id="results" class="bg-gray-900 text-green-300 p-4 rounded-lg mt-2 whitespace-pre-wrap break-all h-64 overflow-y-auto text-sm border border-gray-700">Aguardando envio...</pre>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('analysisForm');
            const submitButton = document.getElementById('submitButton');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const uploadArea = document.getElementById('document-upload-area');

            const allDocTypes = {
                "RG": "RG",
                "CPF": "CPF",
                "CNH": "CNH",
                "DIPLOMA_GRADUACAO": "Diploma de Graduação",
                "HISTORICO_GRADUACAO": "Histórico de Graduação",
                "HISTORICO_ENSINO_MEDIO": "Histórico do Ensino Médio",
                "CERTIFICADO_ENSINO_MEDIO": "Certificado de Conclusão do Ensino Médio",
                "QUITACAO_ELEITORAL": "Quitação Eleitoral",
                "DOCUMENTO_MILITAR": "Documento Militar",
                "CERTIDAO_NASCIMENTO_CASAMENTO": "Certidão de Nascimento/Casamento",
                "COMPROVANTE_RESIDENCIA": "Comprovante de Residência"
            };

            function createUploadFields() {
                Object.entries(allDocTypes).forEach(([key, displayName]) => {
                    const fieldContainer = document.createElement('div');
                    fieldContainer.className = 'flex items-center gap-4 bg-white p-3 rounded-lg border';
                    
                    const label = document.createElement('label');
                    label.htmlFor = `file-${key}`;
                    label.className = 'flex-1 text-sm font-medium text-gray-700';
                    label.textContent = displayName;

                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.id = `file-${key}`;
                    fileInput.dataset.key = key; // Usamos data-key para identificar o tipo
                    fileInput.multiple = true;
                    fileInput.accept = '.pdf,.jpg,.jpeg,.png';
                    fileInput.className = 'w-full max-w-xs text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition';

                    fieldContainer.appendChild(label);
                    fieldContainer.appendChild(fileInput);
                    uploadArea.appendChild(fieldContainer);
                });
            }

            createUploadFields();

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                submitButton.disabled = true;
                submitButton.innerHTML = `
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    A processar...
                `;
                loading.classList.remove('hidden');
                results.textContent = 'Aguardando resposta do servidor...';
                results.classList.remove('text-red-400');
                results.classList.add('text-green-300');

                const formData = new FormData();
                formData.append('studentName', document.getElementById('studentName').value);
                formData.append('courseType', document.getElementById('courseType').value);

                const fileInputs = uploadArea.querySelectorAll('input[type="file"]');
                let filesWereAdded = false;

                // --- CORREÇÃO APLICADA AQUI ---
                fileInputs.forEach(input => {
                    const docKey = input.dataset.key; // Ex: 'RG', 'CPF'
                    if (input.files.length > 0) {
                        filesWereAdded = true;
                        Array.from(input.files).forEach(file => {
                            // O nome do campo (o primeiro argumento) DEVE ser o tipo de documento,
                            // exatamente como na página principal.
                            formData.append(docKey, file, file.name);
                        });
                    }
                });
                // --- FIM DA CORREÇÃO ---
                
                if (!filesWereAdded) {
                    results.textContent = 'Nenhum ficheiro selecionado. Por favor, anexe pelo menos um documento.';
                    results.classList.add('text-red-400');
                    loading.classList.add('hidden');
                    submitButton.disabled = false;
                    submitButton.textContent = 'Enviar para Análise';
                    return;
                }

                const fullUrl = window.location.origin + '/analisar';

                try {
                    const response = await fetch(fullUrl, {
                        method: 'POST',
                        body: formData,
                        credentials: 'same-origin', // Importante para sessões de login
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(`Erro do Servidor: ${response.status} ${response.statusText}\n${JSON.stringify(data, null, 2)}`);
                    }

                    results.textContent = JSON.stringify(data, null, 2);

                } catch (error) {
                    console.error('Erro de Conexão:', error);
                    results.textContent = `Erro de Conexão:\n\n${error.message}`;
                    results.classList.add('text-red-400');
                    results.classList.remove('text-green-300');
                } finally {
                    loading.classList.add('hidden');
                    submitButton.disabled = false;
                    submitButton.textContent = 'Enviar para Análise';
                }
            });
        });
    </script>
</body>
</html>
