    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Variáveis Base (Modo Claro) */
            --imes-dark-blue: #0a2351;
            --imes-gold: #fdb913;
            --bg-color: #f0f2f5;
            --frame-color: #ffffff;
            --text-color: #333333;
            --text-secondary: #4b5563;
            --success-color: #27ae60;
            --pending-color: #fdb913;
            --input-bg: #f3f4f6;
            --input-text: #1f2937;
        }

        /* --- MODO ESCURO --- */
        body.dark-mode {
            --bg-color: #121212;
            --frame-color: #1e1e1e;
            --text-color: #e5e7eb;
            --text-secondary: #9ca3af;
            --input-bg: #2d2d2d;
            --input-text: #ffffff;
        }

        /* Overrides do Tailwind para Dark Mode */
        body.dark-mode .bg-gray-100 { background-color: var(--bg-color) !important; }
        body.dark-mode .bg-white { background-color: var(--frame-color) !important; }
        body.dark-mode .text-gray-800, 
        body.dark-mode .text-gray-700 { color: var(--text-color) !important; }
        body.dark-mode .text-gray-500 { color: var(--text-secondary) !important; }
        
        /* Ajustes específicos de inputs no Dark Mode */
        body.dark-mode input[type="tel"],
        body.dark-mode select,
        body.dark-mode #chat-input {
            background-color: var(--input-bg) !important;
            color: var(--input-text) !important;
            border-color: #444 !important;
        }

        /* Ajuste do Chat Bubble no Dark Mode */
        body.dark-mode #chat-bubble {
            background-color: var(--frame-color);
            color: var(--text-color);
        }
        body.dark-mode #chat-area {
            background-color: var(--bg-color);
        }
        body.dark-mode .bg-gray-200 { /* Balões do bot */
            background-color: #2d2d2d !important; 
            color: #fff !important;
        }
        
        html { scroll-behavior: smooth; height: 100%; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); height: 100%; overflow: hidden; transition: background-color 0.3s, color 0.3s; }
        
        .sidebar { background-color: var(--imes-dark-blue); color: #ffffff; }
        .btn-accent { background-color: var(--imes-gold); color: var(--imes-dark-blue); transition: background-color 0.3s; }
        .btn-accent:hover { background-color: #e8a800; }
        .btn-accent:disabled { background-color: #fdb813a1; cursor: not-allowed; color: #0a2351a3; }
        
        .card { 
            background-color: var(--frame-color); 
            border: 1px solid #e0e0e01a;
            border-radius: 0.75rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: box-shadow 0.3s, transform 0.3s, background-color 0.3s; 
        }
        .card:hover { 
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
            transform: translateY(-3px); 
        }

        .status-pending { color: var(--pending-color); }
        .status-success { color: var(--success-color); }
        
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #aaa; }
        
        #assistant-icon { transition: transform 0.3s, background-color 0.3s; z-index: 40; }
        #assistant-icon:hover { transform: scale(1.1); background-color: var(--imes-gold); }
        
        #chat-bubble { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 50; }
        
        /* --- CSS DO SWITCH (TEMA) --- */
        /* From Uiverse.io by JustCode14 */ 
        .switch {
            font-size: 12px; /* Reduzi um pouco para caber bem na sidebar */
            position: relative;
            display: inline-block;
            width: 4em;
            height: 2.2em;
            border-radius: 30px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 0.5rem;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2a2a2a; /* Cor da Noite */
            transition: 0.4s;
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 1.2em;
            width: 1.2em;
            border-radius: 20px;
            left: 0.5em;
            bottom: 0.5em;
            transition: 0.4s;
            transition-timing-function: cubic-bezier(0.81, -0.04, 0.38, 1.5);
            box-shadow: inset 8px -4px 0px 0px #fff; /* Lua */
        }

        .switch input:checked + .slider {
            background-color: #00a6ff; /* Cor do Dia */
        }

        .switch input:checked + .slider:before {
            transform: translateX(1.8em);
            box-shadow: inset 15px -4px 0px 15px #ffcf48; /* Sol */
        }

        .star {
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            width: 5px;
            transition: all 0.4s;
            height: 5px;
        }

        .star_1 { left: 2.5em; top: 0.5em; }
        .star_2 { left: 2.2em; top: 1.2em; }
        .star_3 { left: 3em; top: 0.9em; }

        .switch input:checked ~ .slider .star {
            opacity: 0;
        }

        .cloud {
            width: 3.5em;
            position: absolute;
            bottom: -1.4em;
            left: -1.1em;
            opacity: 0;
            transition: all 0.4s;
        }

        .switch input:checked ~ .slider .cloud {
            opacity: 1;
        }
        /* --- FIM CSS SWITCH --- */


        /* --- Loader Estilizado (Rings) --- */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.98); display: flex;
            justify-content: center; align-items: center; z-index: 100;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }
        /* Ajuste do loader para Dark Mode */
        body.dark-mode .loader-overlay {
            background-color: rgba(18, 18, 18, 0.98);
        }
        body.dark-mode #loading-step-text { color: #fff; }
        body.dark-mode .loader-title { color: #fff; }

        #ring-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 190px;
            height: 190px;
            margin-bottom: 2rem;
        }

        #loading-step-text {
            color: var(--imes-dark-blue);
            z-index: 10;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            text-align: center;
            animation: pulse-text 1.5s infinite;
        }

        .ring {
            width: 190px;
            height: 190px;
            border: 1px solid transparent;
            border-radius: 50%;
            position: absolute;
        }

        .ring:nth-child(1) { border-bottom: 8px solid var(--imes-gold); animation: rotate1 2s linear infinite; }
        @keyframes rotate1 { from { transform: rotateX(50deg) rotateZ(110deg); } to { transform: rotateX(50deg) rotateZ(470deg); } }

        .ring:nth-child(2) { border-bottom: 8px solid var(--imes-dark-blue); animation: rotate2 2s linear infinite; }
        @keyframes rotate2 { from { transform: rotateX(20deg) rotateY(50deg) rotateZ(20deg); } to { transform: rotateX(20deg) rotateY(50deg) rotateZ(380deg); } }

        .ring:nth-child(3) { border-bottom: 8px solid var(--imes-gold); animation: rotate3 2s linear infinite; }
        @keyframes rotate3 { from { transform: rotateX(40deg) rotateY(130deg) rotateZ(450deg); } to { transform: rotateX(40deg) rotateY(130deg) rotateZ(90deg); } }

        .ring:nth-child(4) { border-bottom: 8px solid var(--imes-dark-blue); animation: rotate4 2s linear infinite; }
        @keyframes rotate4 { from { transform: rotateX(70deg) rotateZ(270deg); } to { transform: rotateX(70deg) rotateZ(630deg); } }

        .analyzing-text { transition: opacity 0.3s; }
        @keyframes pulse-text { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        #app-container { height: 100dvh; }

        /* --- Animações do Chat (Novas) --- */
        @keyframes slideUpFade { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-fade-in { animation: slideUpFade 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Portal Aluno Carregado");

            // --- TEMA / MODO ESCURO ---
            const themeToggle = document.getElementById('theme-toggle');
            const body = document.body;

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                body.classList.add('dark-mode');
                themeToggle.checked = false; // Desmarcado = Lua
            } else {
                body.classList.remove('dark-mode');
                themeToggle.checked = true; // Marcado = Sol
            }

            themeToggle.addEventListener('change', () => {
                if (themeToggle.checked) {
                    body.classList.remove('dark-mode');
                    localStorage.setItem('theme', 'light');
                } else {
                    body.classList.add('dark-mode');
                    localStorage.setItem('theme', 'dark');
                }
            });

            // --- CRITÉRIOS DE DOCUMENTOS (REESTRUTURADO PARA EVITAR CACHE DE CHAVE) ---
            // Usamos IDs simples como chave para evitar problemas de encoding ou cache
            const criteria = {
                "graduacao_1": {
                    label: "1ª Graduação",
                    docs: {
                        "RG": {"display_name": "Carteira de Identidade (RG)"},
                        "CPF": {"display_name": "Cadastro de Pessoa Física (CPF)"},
                        "RNE": {"display_name": "Registro Nacional Estrangeiro (RNE/CRNM)"},
                        "HISTORICO_ENSINO_MEDIO": {"display_name": "Histórico Escolar do Ensino Médio"},
                        "CERTIFICADO_ENSINO_MEDIO": { "display_name": "Certificado de Conclusão do Ensino Médio"}, 
                        "CERTIDAO_NASCIMENTO_CASAMENTO": {"display_name": "Certidão de Nascimento ou Casamento"},
                        "DOCUMENTO_MILITAR": {"display_name": "Certificado de Reservista"},
                        "QUITACAO_ELEITORAL": {"display_name": "Comprovante de Quitação Eleitoral"},
                        "COMPROVANTE_RESIDENCIA": {"display_name": "Comprovante de Residência"}
                    }

            async function handleStudentSearch() {
                const cleanedCpf = studentCpfInput.value.replace(/\D/g, '');
                if (cleanedCpf.length !== 11) {
                    showModal("Atenção", "<p>Por favor, digite um CPF válido com 11 dígitos para buscar.</p>", true);
                    return;
                }
                setSearchButtonLoading(true);
                try {
                    const response = await fetch(`/search-student`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cpf: cleanedCpf }),
                    });

                    if (response.status === 404) {
                        showModal("Aluno não encontrado", "Não foi possível localizar um aluno com o CPF informado. Verifique os dados e tente novamente.");
                        resetStudentSearch();
                        return;
                    }
                    if (!response.ok) throw new Error(`Erro: ${response.status}`);

                    const aluno = await response.json();
                    studentData = { id: aluno.id, name: aluno.name, cpf: aluno.cpf, existingDocs: {} };

                    const firstName = studentData.name.split(' ')[0];
                    if(userGreeting) userGreeting.querySelector('strong').textContent = firstName;
                    studentNameDisplay.textContent = studentData.name;
                    
                    studentCpfContainer.classList.add('hidden');
                    studentNameDisplayContainer.classList.remove('hidden');

                    courseTypeSelect.disabled = false;
                    checkDocsBtn.disabled = false;
                    courseTypeSelect.value = '';
                    courseTypeSelect.querySelector('option').textContent = "Selecione um curso...";
                    
                    docsList.innerHTML = `<div class="text-center text-gray-500 py-16 animate-fade-in"><p>Aluno encontrado! Por favor, selecione um curso e clique em "Verificar Documentos".</p></div>`;
                    docsTitle.classList.add('hidden');

                } catch (error) {
                    console.error(error);
                    showModal("Erro de Conexão", "Não foi possível comunicar com o servidor.");
                    resetStudentSearch();
                } finally {
                    setSearchButtonLoading(false);
                }
            }

            function handleFileSelect(event) {
                const fileInput = event.target;
                const docKey = fileInput.dataset.key;
                const newFiles = Array.from(fileInput.files);

                if (!selectedFiles[docKey]) selectedFiles[docKey] = [];

                if (selectedFiles[docKey].length + newFiles.length > 3) {
                    showModal("Limite de Arquivos Excedido", "<p>Você só pode anexar no máximo 3 arquivos por documento.</p>", true);
                    fileInput.value = '';
                    return;
                }

                selectedFiles[docKey].push(...newFiles);
                renderFilePills(docKey);
                fileInput.value = '';
            }

            function renderFilePills(docKey) {
                const container = document.getElementById(`files-container-${docKey}`);
                const statusLabel = document.getElementById(`status-${docKey}`);
                if (!container || !statusLabel) return;

                container.innerHTML = '';
                const files = selectedFiles[docKey] || [];

                files.forEach((file, index) => {
                    const pill = document.createElement('div');
                    pill.className = 'bg-blue-100 text-blue-800 text-sm font-medium px-3 py-1 rounded-full flex items-center gap-2 animate-fade-in';
                    pill.innerHTML = `<span class="truncate max-w-[150px] sm:max-w-xs" title="${file.name}">${file.name}</span><button class="remove-file-btn font-bold text-red-500 hover:text-red-700" data-key="${docKey}" data-index="${index}">&times;</button>`;
                    container.appendChild(pill);
                });

                if (files.length > 0) {
                    statusLabel.textContent = `✔ ${files.length} arquivo(s) anexado(s)`;
                    statusLabel.className = 'text-sm font-medium status-success';
                } else {
                    const docInfoFromServer = studentData.existingDocs[docKey];
                    const isSubmitted = docInfoFromServer?.encontrado === true;
                    statusLabel.textContent = isSubmitted ? '✔ Documento já entregue' : '● Pendente';

            function exibirFeedbackAnalise(serverResponse, currentStudentName, submittedKeys) {
                 if (!serverResponse || !serverResponse.results) {
                      showModal('Erro na Análise', '<p>Ocorreu um erro inesperado na resposta do servidor. Por favor, tente novamente.</p>', true);
                      return;
                 }
                 const results = serverResponse.results;
                 const rejectedDocs = [];
                 
                 const courseTypeId = courseTypeSelect.value;
                 const selectedConfig = criteria[courseTypeId] || {};
                 const requiredDocsConfig = selectedConfig.docs || {};

                 submittedKeys.forEach(submittedKey => {
                      if (results[submittedKey] && results[submittedKey].status !== 'approved') {
                           rejectedDocs.push({
                                name: requiredDocsConfig[submittedKey]?.display_name || submittedKey.replace(/_/g, ' '),
                                reason: results[submittedKey].reason || 'Motivo não especificado.'
                           });
                      } else if (results[submittedKey]?.status === 'error') {
                           rejectedDocs.push({
                                name: requiredDocsConfig[submittedKey]?.display_name || submittedKey.replace(/_/g, ' '),
                                reason: `Erro durante a análise: ${results[submittedKey].reason}`
                           });
                      } else if (!results[submittedKey]) {
                            rejectedDocs.push({
                                name: requiredDocsConfig[submittedKey]?.display_name || submittedKey.replace(/_/g, ' '),
                                reason: 'O servidor não retornou um resultado para este documento.'
                            });
                      }
                 });

                 const firstName = currentStudentName ? currentStudentName.split(' ')[0] : 'Aluno(a)';
                 
                 if (rejectedDocs.length > 0) {
                      let bodyHtml = `<div class="text-left"><p class="font-semibold text-lg">Olá ${firstName}! Tudo bem?!</p><p class="mt-2">Analisamos os documentos enviados! No entanto, ficaram alguns com pendências.</p><div class="mt-4 p-3 bg-red-50 rounded-md"><h4 class="font-bold text-red-800">Pendências encontradas nos documentos enviados:</h4><ul class="list-disc list-inside text-red-700 mt-2 space-y-1">`;
                      rejectedDocs.forEach(doc => { bodyHtml += `<li><strong>${doc.name}:</strong> ${doc.reason}</li>`; });
                      bodyHtml += `</ul></div><p class="mt-4 text-xs text-gray-500 text-center italic">*OS DOCUMENTOS DEVEM SER ENVIADOS ESCANEADOS EM PDF PARA NÃO PERDER A RESOLUÇÃO*</p><p class="mt-3 text-sm text-center">*** Em caso de dúvida, entre em contato com nossa Central de Atendimento. ***</p><p class="mt-2 font-semibold text-center">Cordialmente,<br>Equipe IMES.</p></div>`;
                      showModal('Análise Concluída - Com Pendências', bodyHtml, true);
                 } else {
                      const successMessage = `<div class="text-center"><p class="text-xl font-semibold">Olá ${firstName}! Tudo bem?!</p><p class="mt-2">Recebemos e analisamos com sucesso os documentos que você enviou!</p><p class="mt-4 text-sm text-gray-500">*** Em caso de dúvida, entre em contato com nossa Central de Atendimento. ***</p><p class="mt-4 font-semibold">Cordialmente,<br>Equipe IMES.</p></div>`;
                      showModal('Análise Concluída', successMessage, false);
                 }
                 selectedFiles = {};
                 displayCourseDocuments();
            }

            function updateLoaderUI(step, docName, progress) {
                loadingStepText.textContent = step;
                loadingDocName.textContent = docName;
                loadingProgressBar.style.width = `${progress}%`;
                loadingPercentage.textContent = `${progress}%`;

            async function sendFiles() {
                 const hasFiles = Object.values(selectedFiles).some(arr => arr && arr.length > 0);
                 if (!studentData.name) return showModal("Atenção", "<p>Você precisa buscar um aluno antes de enviar.</p>", true);
                 if (!hasFiles) return showModal("Atenção", "<p>Você precisa anexar pelo menos um novo documento antes de enviar para análise.</p>", true);

                 loadingOverlay.classList.remove('hidden');
                 updateLoaderUI("Iniciando", "Preparando arquivos...", 5);
                 
                 const courseTypeId = courseTypeSelect.value;
                 const selectedConfig = criteria[courseTypeId] || {};
                 const requiredDocsConfig = selectedConfig.docs || {};
                 
                 const formData = new FormData();
                 formData.append('studentName', studentData.name);
                 formData.append('courseType', selectedConfig.label || courseTypeId); 
                 formData.append('courseTypeId', courseTypeId); // Importante para o backend novo

                 const submittedKeys = [];
                 const submittedFilesList = []; 

                 for (const [docKey, fileArray] of Object.entries(selectedFiles)) {
                      if(fileArray && fileArray.length > 0) {
                           submittedKeys.push(docKey);
                           const friendlyName = requiredDocsConfig[docKey]?.display_name || docKey;
                           submittedFilesList.push(friendlyName);
                           
                           fileArray.forEach(file => formData.append(docKey, file, file.name));
                      }
                 }

                 let serverResponse = null;
                 let fetchError = null;
                 
                 const fetchPromise = fetch(`/analisar`, { method: 'POST', body: formData })
                    .then(async res => {
                        const txt = await res.text();
                        if (!res.ok) throw new Error(res.status);
                        try { return JSON.parse(txt); } catch(e) { return { error: "JSON Inválido" }; }
                    })
                    .then(data => { serverResponse = data; })
                    .catch(err => { fetchError = err; });

                 const totalSteps = submittedFilesList.length;
                 const stepSize = 80 / totalSteps; 
                 let currentProgress = 10;

                 for (let i = 0; i < totalSteps; i++) {
                      const docName = submittedFilesList[i];
                      updateLoaderUI("Lendo", docName, Math.round(currentProgress));
                      await new Promise(r => setTimeout(r, 600)); 
                      updateLoaderUI("Validando", docName, Math.round(currentProgress + (stepSize/2)));
                      await new Promise(r => setTimeout(r, 600)); 
                      currentProgress += stepSize;
                 }

                 updateLoaderUI("Processando", "Gerando Relatório...", 90);
                 
                 if (!serverResponse && !fetchError) {
                      await fetchPromise;
                 }

                 updateLoaderUI("Concluído", "Finalizando...", 100);
                 await new Promise(r => setTimeout(r, 500)); 

                 loadingOverlay.classList.add('hidden');

                 if (fetchError) {
                      console.error(fetchError);
                      showModal("Erro de Conexão", `<p>Não foi possível conectar ao servidor de análise.</p>`, true);
                 } else {
                      exibirFeedbackAnalise(serverResponse, studentData.name, submittedKeys);
                 }
            }

                const msgWrapper = document.createElement('div');
                msgWrapper.className = `flex flex-col mb-4 animate-fade-in ${sender === 'user' ? 'items-end' : 'items-start'}`;

                msgBubble.innerHTML = message.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                
                msgWrapper.appendChild(msgBubble);
                chatArea.appendChild(msgWrapper);
                chatArea.scrollTop = chatArea.scrollHeight;

                 indicator.id = 'typing-indicator';
                 indicator.className = 'flex flex-col mb-4 items-start animate-fade-in';
                 indicator.innerHTML = `<div class="p-3 rounded-lg bg-gray-200 shadow-sm"><div class="flex items-center space-x-1.5"><div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce"></div><div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay:-0.15s;"></div><div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay:-0.3s;"></div></div></div>`;
                 chatArea.appendChild(indicator);
                 chatArea.scrollTop = chatArea.scrollHeight;
            }

            function hideTypingIndicator() {
                document.getElementById('typing-indicator')?.remove();
            }

            async function simulateHumanTyping(fullText) {
                let chunks = fullText.split('<SPLIT>');
                chunks = chunks.filter(c => c.trim().length > 0);

                for (let i = 0; i < chunks.length; i++) {
                    const chunk = chunks[i].trim();
                    
                    showTypingIndicator(); 

                    let delay = Math.min(Math.max(chunk.length * 30, 1000), 3000);
                    
                    await new Promise(r => setTimeout(r, delay));

                    hideTypingIndicator();
                    addMessageToChat(chunk, 'assistant');
                }
            }

            async function sendChatMessage(e) {
                 if(e) e.preventDefault();
                 const userMessage = chatInput.value.trim();
                 if (!userMessage) return;
                 
                 addMessageToChat(userMessage, "user");
                 chatInput.value = '';
                 chatSendBtn.disabled = true;
                 showTypingIndicator();

                 try {
                      const courseTypeId = courseTypeSelect.value;
                      const selectedConfig = criteria[courseTypeId] || {};
                      
                      const response = await fetch(`/ask-assistant`, {
                           method: 'POST',
                           headers: { 'Content-Type': 'application/json' },
                           body: JSON.stringify({
                                question: userMessage, 
                                chat_history: chatHistory.slice(-11, -1),
                                studentName: studentData.name || '',
                                courseType: selectedConfig.label || courseTypeId || ''
                           }),
                      });
                      
                      if (!response.ok) throw new Error("Erro");
                      const data = await response.json();
                      hideTypingIndicator();
                      
                      if (data.answer) {
                          await simulateHumanTyping(data.answer);
                      } else {
                          addMessageToChat("Desculpe, não consegui conectar ao meu cérebro. Tente novamente mais tarde.", "assistant");
                      }

                 } catch (error) {
                      hideTypingIndicator();
                      addMessageToChat("Desculpe, erro de conexão. Tente novamente mais tarde.", "assistant");
                 } finally {
                      chatSendBtn.disabled = false;
                      if(window.innerWidth >= 768) chatInput.focus();
                 }
            }
            
            // Listeners
            studentCpfInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '');
                v = v.replace(/(\d{3})(\d)/, '$1.$2');
                v = v.replace(/(\d{3})(\d)/, '$1.$2');
                v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                e.target.value = v;
            });
            searchCpfBtn.addEventListener('click', handleStudentSearch);
            studentCpfInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleStudentSearch(); });

            courseTypeSelect.addEventListener('change', () => {
                if (studentData.id && courseTypeSelect.value) {
                    docsList.innerHTML = `<div class="text-center text-gray-500 py-16"><p>Curso selecionado. Clique em "Verificar Documentos" para continuar.</p></div>`;
                    docsTitle.classList.add('hidden');
                    sendFilesBtn.disabled = true;
                    selectedFiles = {};
                } else if (studentData.id) {
                    docsList.innerHTML = `<div class="text-center text-gray-500 py-16"><p>Por favor, selecione um curso para ver os documentos necessários.</p></div>`;
                    docsTitle.classList.add('hidden');
                    sendFilesBtn.disabled = true;
                }
            });

            checkDocsBtn.addEventListener('click', displayCourseDocuments);
            sendFilesBtn.addEventListener('click', sendFiles);
            changeStudentBtn.addEventListener('click', resetStudentSearch);
            
            docsList.addEventListener('change', (e) => { if (e.target.type === 'file') handleFileSelect(e); });
            docsList.addEventListener('click', (e) => {
                const btn = e.target.closest('.remove-file-btn');
                if (btn) removeFile(btn.dataset.key, parseInt(btn.dataset.index, 10));
            });

            assistantIcon.addEventListener('click', (e) => { e.stopPropagation(); toggleChat(); });
            closeChatBtn.addEventListener('click', toggleChat);
            chatOverlay.addEventListener('click', toggleChat);
            chatForm.addEventListener('submit', sendChatMessage);
            modalCloseBtn.addEventListener('click', closeModal);
            if(modalCloseX) modalCloseX.addEventListener('click', closeModal);

            initialize();
        });
    </script>
</body>
</html>
