name: Security regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock bandit pip-audit
      - run: python tests/run_regressions.py test-results
      - run: bandit -r security api_server.py adapters/database/dossier_repository.py adapters/storage/local_storage.py
      - run: pip-audit -r requirements.lock
